<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura de consumir_gemini.py</title>
  <desc id="descripcion">Flujo de una pregunta a Gemini, con funciones, credencial, errores, tokens y costo.</desc>
  <defs>
    <style>
      .t{font-family:Arial,sans-serif;fill:#14213d}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526177}.h{font-size:21px;font-weight:700}.p{font-size:16px}.small{font-size:14px}.box{stroke-width:2;rx:16}.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.side{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrowGray)}.dash{stroke-dasharray:7 6}.err{fill:#fff1f2;stroke:#e11d48}.note{fill:#fffbeb;stroke:#d97706}.func{fill:#eff6ff;stroke:#2563eb}.external{fill:#f0fdf4;stroke:#16a34a}.result{fill:#f5f3ff;stroke:#7c3aed}.label{fill:#fff;font-size:14px;font-weight:700}.tag{fill:#334155}.line{stroke:#cbd5e1;stroke-width:1}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1800" height="1460" fill="#f8fafc"/>
  <text x="900" y="62" text-anchor="middle" class="t title">Arquitectura de la miniaplicación · src/consumir_gemini.py</text>
  <text x="900" y="94" text-anchor="middle" class="t sub">Pregunta → petición a Gemini → respuesta JSON → texto, tokens y costo</text>

  <!-- Entrada y coordinador -->
  <rect x="70" y="155" width="240" height="92" class="box external"/>
  <text x="190" y="192" text-anchor="middle" class="t h">Usuario</text>
  <text x="190" y="218" text-anchor="middle" class="t p">pregunta: str</text>

  <rect x="405" y="145" width="300" height="112" class="box func"/>
  <text x="555" y="183" text-anchor="middle" class="t h">obtener_dato_de_prueba</text>
  <text x="555" y="211" text-anchor="middle" class="t p">coordina el flujo</text>
  <text x="555" y="234" text-anchor="middle" class="t small">(sin repetir la lógica)</text>
  <path d="M310 201 H405" class="flow"/>
  <rect x="326" y="176" width="63" height="22" rx="5" class="tag"/><text x="357" y="192" text-anchor="middle" class="label">pregunta</text>

  <!-- functions -->
  <rect x="805" y="135" width="345" height="132" class="box func"/>
  <text x="977" y="171" text-anchor="middle" class="t h">armar_peticion(pregunta)</text>
  <text x="977" y="201" text-anchor="middle" class="t p">valida la pregunta y prepara</text>
  <text x="977" y="226" text-anchor="middle" class="t p">URL + body + api_key</text>
  <path d="M705 201 H805" class="flow"/>
  <rect x="716" y="176" width="76" height="22" rx="5" class="tag"/><text x="754" y="192" text-anchor="middle" class="label">pregunta</text>

  <rect x="1250" y="135" width="355" height="132" class="box func"/>
  <text x="1427" y="171" text-anchor="middle" class="t h">enviar_peticion(url, body, api_key)</text>
  <text x="1427" y="201" text-anchor="middle" class="t p">POST con requests</text>
  <text x="1427" y="226" text-anchor="middle" class="t p">timeout=30 segundos</text>
  <path d="M1150 201 H1250" class="flow"/>
  <rect x="1157" y="176" width="85" height="22" rx="5" class="tag"/><text x="1199" y="192" text-anchor="middle" class="label">url, body, key</text>

  <!-- env -->
  <rect x="780" y="352" width="390" height="128" class="box note"/>
  <text x="975" y="389" text-anchor="middle" class="t h">.env (no se sube a Git)</text>
  <text x="975" y="420" text-anchor="middle" class="t p">GEMINI_API_KEY</text>
  <text x="975" y="447" text-anchor="middle" class="t small">leída con os.getenv dentro de armar_peticion</text>
  <path d="M975 352 V267" class="side"/>
  <text x="992" y="316" class="t small">api_key</text>
  <path d="M1150 242 C1190 242 1200 305 1250 305 V267" class="side dash"/>
  <text x="1197" y="323" class="t small">se usa como header</text>
  <text x="1197" y="342" class="t small">x-goog-api-key</text>

  <!-- provider -->
  <rect x="1280" y="387" width="295" height="112" class="box external"/>
  <text x="1427" y="425" text-anchor="middle" class="t h">API Gemini</text>
  <text x="1427" y="454" text-anchor="middle" class="t p">generateContent</text>
  <text x="1427" y="478" text-anchor="middle" class="t small">modelo configurado</text>
  <path d="M1427 267 V387" class="flow"/>
  <rect x="1452" y="306" width="131" height="22" rx="5" class="tag"/><text x="1517" y="322" text-anchor="middle" class="label">HTTP POST / JSON</text>
  <path d="M1280 455 H1215 V560 H1125" class="flow"/>
  <rect x="1150" y="492" width="118" height="22" rx="5" class="tag"/><text x="1209" y="508" text-anchor="middle" class="label">respuesta JSON</text>

  <!-- response processors -->
  <rect x="770" y="500" width="355" height="130" class="box func"/>
  <text x="947" y="538" text-anchor="middle" class="t h">extraer_texto(datos)</text>
  <text x="947" y="568" text-anchor="middle" class="t p">lee candidates[0].content</text>
  <text x="947" y="593" text-anchor="middle" class="t p">.parts[0].text</text>
  <path d="M770 565 H650 V697" class="flow"/>
  <rect x="659" y="604" width="104" height="22" rx="5" class="tag"/><text x="711" y="620" text-anchor="middle" class="label">texto extraído</text>

  <rect x="1240" y="665" width="345" height="130" class="box result"/>
  <text x="1412" y="703" text-anchor="middle" class="t h">calcular_costo(datos,</text>
  <text x="1412" y="729" text-anchor="middle" class="t h">precio_entrada, precio_salida)</text>
  <text x="1412" y="760" text-anchor="middle" class="t p">lee usageMetadata</text>
  <path d="M1427 499 V575 H1412 V665" class="flow"/>
  <rect x="1444" y="570" width="119" height="22" rx="5" class="tag"/><text x="1503" y="586" text-anchor="middle" class="label">usageMetadata</text>

  <rect x="310" y="660" width="340" height="110" class="box result"/>
  <text x="480" y="698" text-anchor="middle" class="t h">Resultado para usuario</text>
  <text x="480" y="729" text-anchor="middle" class="t p">texto generado</text>

  <rect x="1240" y="875" width="345" height="105" class="box result"/>
  <text x="1412" y="914" text-anchor="middle" class="t h">Costo real por petición</text>
  <text x="1412" y="945" text-anchor="middle" class="t p">USD: entrada × precio + salida × precio</text>
  <path d="M1412 795 V875" class="flow"/>
  <rect x="1431" y="826" width="120" height="22" rx="5" class="tag"/><text x="1491" y="842" text-anchor="middle" class="label">costo calculado</text>

  <!-- errors -->
  <text x="70" y="865" class="t title" style="font-size:27px">Manejo de errores real del módulo</text>
  <line x1="70" y1="885" x2="1730" y2="885" class="line"/>

  <rect x="75" y="930" width="380" height="205" class="box err"/>
  <text x="265" y="967" text-anchor="middle" class="t h">armar_peticion</text>
  <text x="105" y="1005" class="t p">• ValueError</text><text x="235" y="1005" class="t small">pregunta vacía o inválida</text>
  <text x="105" y="1040" class="t p">• RuntimeError</text><text x="255" y="1040" class="t small">falta GEMINI_API_KEY</text>
  <text x="105" y="1080" class="t small">Validaciones antes de hacer red.</text>

  <rect x="500" y="930" width="410" height="300" class="box err"/>
  <text x="705" y="967" text-anchor="middle" class="t h">enviar_peticion · bloques try/except</text>
  <text x="530" y="1005" class="t p">try: requests.post(...)</text>
  <text x="530" y="1030" class="t small">except RequestException → RuntimeError de conexión</text>
  <text x="530" y="1070" class="t p">try: respuesta.raise_for_status()</text>
  <text x="530" y="1095" class="t small">except HTTPError → RuntimeError con código HTTP</text>
  <text x="530" y="1135" class="t p">try: respuesta.json()</text>
  <text x="530" y="1160" class="t small">except JSONDecodeError → RuntimeError de formato</text>

  <rect x="955" y="930" width="355" height="205" class="box err"/>
  <text x="1132" y="967" text-anchor="middle" class="t h">extraer_texto · try/except</text>
  <text x="985" y="1005" class="t p">try: leer candidates...</text>
  <text x="985" y="1032" class="t small">except KeyError, IndexError, TypeError</text>
  <text x="985" y="1057" class="t small">→ RuntimeError: texto ausente</text>
  <text x="985" y="1094" class="t small">También valida texto vacío.</text>

  <rect x="1355" y="930" width="375" height="205" class="box err"/>
  <text x="1542" y="967" text-anchor="middle" class="t h">calcular_costo · try/except</text>
  <text x="1385" y="1005" class="t p">try: leer usageMetadata</text>
  <text x="1385" y="1032" class="t small">except KeyError, TypeError</text>
  <text x="1385" y="1057" class="t small">→ RuntimeError: metadatos ausentes</text>
  <text x="1385" y="1094" class="t small">Luego aplica la fórmula de costo.</text>

  <text x="900" y="1330" text-anchor="middle" class="t sub">Las flechas azules muestran datos del flujo; los cuadros rojos documentan las excepciones manejadas.</text>
  <text x="900" y="1365" text-anchor="middle" class="t small">La clave no se incluye en la respuesta ni se versiona: se lee desde .env y se envía solamente en el header de la petición.</text>
</svg>
